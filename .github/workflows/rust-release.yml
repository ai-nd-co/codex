name: rust-release

on:
  push:
    tags:
      - "rust-v0.1.0-beta.*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}

jobs:
  tag-check:
    name: Validate beta release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate release versions
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REPOSITORY}" == "ai-nd-co/codex" ]]
          [[ "${GITHUB_REF_NAME}" =~ ^rust-v0\.1\.0-beta\.[1-9][0-9]*$ ]]

          version="${GITHUB_REF_NAME#rust-v}"
          cargo_version="$(sed -nE 's/^version *= *"([^"]+)"/\1/p' codex-rs/Cargo.toml | head -1)"
          npm_version="$(node -p "require('./codex-cli/package.json').version")"
          [[ "${version}" == "${cargo_version}" && "${version}" == "${npm_version}" ]]

  build-linux:
    name: Build Linux x64
    needs: tag-check
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: off
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false
      - name: Install musl build tools
        env:
          TARGET: x86_64-unknown-linux-musl
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-musl
      - name: Build bwrap
        shell: bash
        run: |
          set -euo pipefail
          export AWS_LC_SYS_NO_JITTER_ENTROPY=1
          export AWS_LC_SYS_NO_JITTER_ENTROPY_X86_64_UNKNOWN_LINUX_MUSL=1
          cargo build --target x86_64-unknown-linux-musl --release --bin bwrap
          strip --strip-debug --strip-unneeded target/x86_64-unknown-linux-musl/release/bwrap
          echo "CODEX_BWRAP_SHA256=$(sha256sum target/x86_64-unknown-linux-musl/release/bwrap | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Build Codex binaries
        shell: bash
        run: |
          set -euo pipefail
          export AWS_LC_SYS_NO_JITTER_ENTROPY=1
          export AWS_LC_SYS_NO_JITTER_ENTROPY_X86_64_UNKNOWN_LINUX_MUSL=1
          cargo build --target x86_64-unknown-linux-musl --release --bin codex --bin codex-code-mode-host
          strip --strip-debug --strip-unneeded \
            target/x86_64-unknown-linux-musl/release/codex \
            target/x86_64-unknown-linux-musl/release/codex-code-mode-host
      - name: Build package archive
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target x86_64-unknown-linux-musl \
            --bundle primary \
            --entrypoint-dir target/x86_64-unknown-linux-musl/release \
            --archive-dir dist/x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: x86_64-unknown-linux-musl
          path: codex-rs/dist/x86_64-unknown-linux-musl/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: tag-check
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Build Codex binaries
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          cargo build --target x86_64-pc-windows-msvc --release \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-command-runner \
            --bin codex-windows-sandbox-setup
      - name: Build package archive
        shell: bash
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target x86_64-pc-windows-msvc \
            --bundle primary \
            --entrypoint-dir "${CARGO_TARGET_DIR}/x86_64-pc-windows-msvc/release" \
            --archive-dir dist/x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: x86_64-pc-windows-msvc
          path: codex-rs/dist/x86_64-pc-windows-msvc/*
          if-no-files-found: error

  publish:
    name: Publish beta release
    needs:
      - tag-check
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@ai-nd-co"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: x86_64-*
      - name: Stage npm packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#rust-v}"
          ./scripts/stage_npm_packages.py \
            --release-version "$version" \
            --artifacts-dir "${GITHUB_WORKSPACE}/dist" \
            --package codex \
            --target x86_64-unknown-linux-musl \
            --target x86_64-pc-windows-msvc
      - name: Publish npm packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NPM_PUBLISH_USE_TOKEN_FALLBACK: ${{ vars.NPM_PUBLISH_USE_TOKEN_FALLBACK }}
          FALLBACK_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#rust-v}"
          if [[ "${NPM_PUBLISH_USE_TOKEN_FALLBACK:-}" == "true" ]]; then
            [[ -n "${FALLBACK_NPM_TOKEN:-}" ]]
            auth_file="${RUNNER_TEMP}/npm-publishrc"
            trap 'rm -f "${auth_file}"' EXIT
            printf '//registry.npmjs.org/:_authToken=%s\n' "${FALLBACK_NPM_TOKEN}" > "${auth_file}"
            export NPM_CONFIG_USERCONFIG="${auth_file}"
          fi

          for tarball in \
            "dist/npm/codex-npm-linux-x64-${version}.tgz" \
            "dist/npm/codex-npm-win32-x64-${version}.tgz" \
            "dist/npm/codex-npm-${version}.tgz"; do
            package_name="$(tar -xOf "$tarball" package/package.json | node -e \
              'let data=""; process.stdin.on("data", chunk => data += chunk).on("end", () => console.log(JSON.parse(data).name))')"
            beta_error_file="$(mktemp "${RUNNER_TEMP}/npm-view-beta.XXXXXX")"
            set +e
            current_beta="$(npm view "${package_name}@beta" version 2>"$beta_error_file")"
            beta_status=$?
            set -e
            if [[ $beta_status -eq 0 ]]; then
              rm -f "$beta_error_file"
            elif grep -qiE "E404|No match found for version beta|is not in this registry" "$beta_error_file"; then
              rm -f "$beta_error_file"
              current_beta=""
            else
              cat "$beta_error_file" >&2
              rm -f "$beta_error_file"
              exit "$beta_status"
            fi
            if [[ -n "$current_beta" ]]; then
              node -e '
                const parse = value => {
                  const match = /^0\.1\.0-beta\.([1-9][0-9]*)$/.exec(value);
                  if (!match) throw new Error(`Unexpected beta version: ${value}`);
                  return Number(match[1]);
                };
                if (parse(process.argv[1]) < parse(process.argv[2])) process.exit(1);
              ' "$version" "$current_beta" || {
                echo "Refusing to move ${package_name}@beta backward from ${current_beta} to ${version}" >&2
                exit 1
              }
            fi

            set +e
            output="$(npm publish "$tarball" --access public --tag beta 2>&1)"
            status=$?
            set -e
            echo "$output"
            if [[ $status -eq 0 ]]; then
              continue
            fi
            if ! grep -qiE "previously published|cannot publish over|version already exists" <<< "$output"; then
              exit "$status"
            fi

            registry_integrity="$(npm view "${package_name}@${version}" dist.integrity)"
            local_integrity="$(node -e \
              'const fs=require("fs"),crypto=require("crypto"); const data=fs.readFileSync(process.argv[1]); console.log("sha512-"+crypto.createHash("sha512").update(data).digest("base64"))' \
              "$tarball")"
            [[ "$registry_integrity" == "$local_integrity" ]] || {
              echo "Published ${package_name}@${version} does not match the staged tarball" >&2
              exit 1
            }
            if [[ "$current_beta" == "$version" ]]; then
              continue
            fi
            if [[ "${NPM_PUBLISH_USE_TOKEN_FALLBACK:-}" != "true" ]]; then
              echo "${package_name}@${version} exists but its beta tag requires authenticated repair" >&2
              exit 1
            fi
            npm dist-tag add "${package_name}@${version}" beta
          done
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.6.1
        with:
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: dist/**/*
